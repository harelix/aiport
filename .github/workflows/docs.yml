# Builds the documentation site from docs/ (site/ holds the Astro Starlight
# setup) on every change to the docs, checks every internal link and anchor,
# and publishes it to GitHub Pages from main.
name: docs
on:
  push:
    branches: [main]
    paths: ['docs/**', 'GLOSSARY.md', 'site/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'GLOSSARY.md', 'site/**', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: install
        run: pnpm --dir site install --frozen-lockfile
      - name: build (fails on a broken link or anchor)
        run: pnpm --dir site build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
